[package]
name = "skyhedge_protection"
version = "0.1.0"
description = "Deterministic weather-risk protection on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "skyhedge_protection"

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=0.30.1", features = ["init-if-needed"] }
anchor-spl = "=0.30.1"
